    <meta property="og:title" content="VZ Files (files.vz.gay) — Transfer File Sementara" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vz_theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-slate-900 dark:bg-[#0B0D11] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

  </body>
