#:schema node_modules/wrangler/config-schema.json
name = "vzfiles"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

[vars]
APP_DOMAIN = "files.vz.gay"
ALT_DOMAIN = "file.vz.gay"
PORTAL_DOMAIN = "vz.gay"
AUTH0_DOMAIN = "accounts.vz.gay"
ACCOUNT_DASHBOARD_URL = "https://myaccount.vz.gay"
SPONSOR_DOMAIN = "jajanserver.com"
COMPANY_NAME = "PT Galeri Langkah Bahagia Yuwana"
COMPANY_BRAND = "galbay"
FILE_SPONSOR_DOMAIN = "vikingfiles.com"
VIKINGFILE_API_URL = "https://vikingfile.com/api"

# Penting / Important:
# Selama wrangler.toml ada di root repo, Cloudflare Pages mengunci tombol "+ Add" Bindings di Dashboard.
# Aktifkan salah satu blok di bawah (D1 ATAU KV) lalu isi ID resource Anda sebelum push ke GitHub,
# atau hapus file wrangler.toml jika ingin mengatur semua binding lewat UI Dashboard Cloudflare Pages.
#
[[d1_databases]]
binding = "DB"
database_name = "vzfiles_db"
database_id = "b7115ed0-e36a-46c8-aa27-0fb8f453ec54"
#
# [[kv_namespaces]]
# binding = "PORTAL_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"
# preview_id = "<OPTIONAL_PREVIEW_KV_NAMESPACE_ID>"
#
